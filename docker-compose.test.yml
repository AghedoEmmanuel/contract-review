version: "3.9"
services:
  postgres-test:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: contract_review_test
    ports:
      - "5433:5432"
    volumes:
      - pgtest-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d contract_review_test"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgtest-data:
