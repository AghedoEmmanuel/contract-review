services:
  postgres:
    image: postgres:16
    container_name: contract-review-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: contract_review
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data



  postgres-test:
    image: postgres:16
    container_name: contract-review-test-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: contract_review
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  postgres_test_data: